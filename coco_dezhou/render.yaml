# Render Blueprint：一键把牌桌部署成免费 Web Service
# 用法：把仓库推到 GitHub → Render → New → Blueprint → 选这个仓库
# 若蓝图校验提示 runtime 字段不合法，把它改成 env: docker 即可（两种写法 Render 都认）
services:
  - type: web
    name: coco-dezhou
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # 端口由 Render 注入（PORT），服务端会自动使用，无需在此声明
      # 免费实例没有持久磁盘：房间/战绩在重启后清空，属正常现象
      - key: NODE_ENV
        value: production
