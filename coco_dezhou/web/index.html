<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>德扑云桌 · 多人德州扑克</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ============ 大厅 ============ -->
<section class="screen screen-home is-active" id="screen-home">
  <div class="home-wrap">
    <header class="brand">
      <div class="brand-suits">♠ <em>♥</em> ♣ <em>♦</em></div>
      <h1>德扑云桌</h1>
      <p>多台手机 · 同一牌桌 · 实时对局</p>
    </header>

    <div class="panel">
      <label class="field">
        <span class="field-label">我的昵称</span>
        <input id="nickname" class="input" maxlength="12" placeholder="例如：阿德" autocomplete="nickname">
      </label>
      <button id="btn-go-create" class="btn btn-primary btn-lg btn-block">创建房间</button>
      <div class="join-row">
        <input id="code-input" class="input code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="输入 6 位房号">
        <button id="btn-join" class="btn btn-ghost">加入</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span>正在进行的房间</span>
        <button id="btn-refresh" class="btn btn-mini">刷新</button>
      </div>
      <div id="room-list" class="room-list">
        <div class="empty">暂无房间，创建一个吧</div>
      </div>
    </div>

    <p class="home-foot">同一 Wi-Fi 下，朋友用手机打开同一网址即可联机</p>
  </div>
</section>

<!-- ============ 创建房间 ============ -->
<section class="screen screen-create" id="screen-create">
  <header class="bar">
    <button class="icon-btn" data-back="home">←</button>
    <h2>创建房间</h2>
    <span class="bar-spacer"></span>
  </header>

  <div class="create-body">
    <label class="field">
      <span class="field-label">房间名（可选）</span>
      <input id="cfg-name" class="input" maxlength="14" placeholder="例如：周末局">
    </label>

    <div class="field">
      <span class="field-label">房间人数</span>
      <div class="stepper" data-stepper="seats">
        <button class="step-btn" data-dir="-1">−</button>
        <input id="cfg-seats" class="input step-input" type="number" inputmode="numeric" value="6" min="2" max="8">
        <button class="step-btn" data-dir="1">+</button>
        <span class="step-unit">人（2–8）</span>
      </div>
    </div>

    <div class="field">
      <span class="field-label">起始筹码</span>
      <div class="stepper" data-stepper="chips">
        <button class="step-btn" data-dir="-1">−</button>
        <input id="cfg-chips" class="input step-input" type="number" inputmode="numeric" value="1000" min="100" step="100">
        <button class="step-btn" data-dir="1">+</button>
        <span class="step-unit">筹码</span>
      </div>
      <div class="chips-row">
        <button class="pill" data-chips="500">500</button>
        <button class="pill" data-chips="1000">1000</button>
        <button class="pill" data-chips="2000">2000</button>
        <button class="pill" data-chips="5000">5000</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">盲注</span>
      <div class="blind-row">
        <div class="blind-box">
          <span>小盲</span>
          <input id="cfg-sb" class="input" type="number" inputmode="numeric" value="10" min="1">
        </div>
        <span class="slash">/</span>
        <div class="blind-box">
          <span>大盲</span>
          <input id="cfg-bb" class="input" type="number" inputmode="numeric" value="20" min="2">
        </div>
      </div>
      <div class="chips-row">
        <button class="pill" data-blind="5,10">5 / 10</button>
        <button class="pill" data-blind="10,20">10 / 20</button>
        <button class="pill" data-blind="25,50">25 / 50</button>
        <button class="pill" data-blind="50,100">50 / 100</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">每步思考时间</span>
      <div class="stepper" data-stepper="seconds">
        <button class="step-btn" data-dir="-1">−</button>
        <input id="cfg-seconds" class="input step-input" type="number" inputmode="numeric" value="25" min="10" max="120">
        <button class="step-btn" data-dir="1">+</button>
        <span class="step-unit">秒</span>
      </div>
    </div>

    <label class="switch-row">
      <span>
        <strong>自动开始下一手</strong>
        <em>摊牌 7 秒后自动发牌</em>
      </span>
      <input id="cfg-autostart" type="checkbox" checked>
      <i class="switch"></i>
    </label>

    <label class="switch-row">
      <span>
        <strong>输光自动补码</strong>
        <em>筹码清零后回到起始筹码</em>
      </span>
      <input id="cfg-autorebuy" type="checkbox">
      <i class="switch"></i>
    </label>

    <button id="btn-create" class="btn btn-primary btn-lg btn-block">创建并进入牌桌</button>
    <div class="hint" id="create-hint"></div>
  </div>
</section>

<!-- ============ 牌桌 ============ -->
<section class="screen screen-table" id="screen-table">
  <header class="table-bar">
    <button class="icon-btn" id="btn-leave">←</button>
    <div class="room-title">
      <div class="room-code" id="room-code">#------</div>
      <div class="room-meta" id="room-meta">盲注 --/--</div>
    </div>
    <button class="icon-btn" id="btn-menu">⋯</button>
  </header>

  <div class="turn-bar"><i id="turn-fill"></i></div>

  <div class="felt" id="felt">
    <div class="felt-ring"></div>
    <div class="pot-chip" id="pot">底池 0</div>
    <div class="board" id="board"></div>
    <div class="street-tag" id="street-tag"></div>
    <div class="seat-layer" id="seat-layer"></div>
    <div class="center-tip" id="center-tip"></div>
  </div>

  <div class="me-area" id="me-area">
    <div class="me-cards" id="me-cards"></div>
    <div class="me-meta">
      <div class="me-name" id="me-name">我</div>
      <div class="me-chips" id="me-chips">0</div>
      <div class="me-state" id="me-state"></div>
    </div>
  </div>

  <div class="action-bar" id="action-bar"></div>

  <div class="log-strip" id="log-strip">等待玩家…</div>
</section>

<!-- ============ 结果弹层 ============ -->
<div class="overlay" id="overlay-result">
  <div class="result-card">
    <div class="result-title" id="result-title">本手结束</div>
    <div class="result-board" id="result-board"></div>
    <div class="result-list" id="result-list"></div>
    <div class="result-foot" id="result-foot">3 秒后继续…</div>
  </div>
</div>

<!-- ============ 菜单 ============ -->
<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet-menu">
  <div class="sheet-grab"></div>
  <h3>房间菜单</h3>
  <div class="sheet-room" id="sheet-room"></div>
  <div class="menu-actions">
    <button class="btn btn-line" id="btn-rebuy">补码</button>
    <button class="btn btn-line" id="btn-sitout">旁观 / 回座</button>
  </div>
  <button class="btn btn-line btn-block" id="btn-history">对局记录（输赢流水）</button>
  <div class="menu-players" id="menu-players"></div>
  <button class="btn btn-danger btn-block" id="btn-quit">退出房间</button>
</div>

<div class="sheet sheet-tall" id="sheet-history">
  <div class="sheet-grab"></div>
  <h3>对局记录</h3>
  <div class="tabs" id="hist-tabs">
    <button class="tab is-active" data-tab="hands">手牌流水</button>
    <button class="tab" data-tab="players">玩家账本</button>
  </div>
  <div class="hist-body" id="hist-body"></div>
</div>

<div class="sheet" id="sheet-log">
  <div class="sheet-grab"></div>
  <h3>牌局记录</h3>
  <div class="log-list" id="log-list"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
